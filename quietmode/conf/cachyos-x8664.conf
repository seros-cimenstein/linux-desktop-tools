# ThinkPad T480, i7-8650U (4C/8T, base 1.9 GHz, turbo 4.2 GHz).
# Sourced as bash by /usr/local/bin/quietmode; re-run install.sh after editing.

# Ceiling for every core, in MHz.
MAX_FREQ_MHZ=1400
# 1 = disable turbo while quiet.
NO_TURBO=1
# Intel RAPL package power limits in watts (long_term = PL1, short_term = PL2).
# Empty leaves the firmware values alone.
RAPL_LONG_W=6
RAPL_SHORT_W=8
# power-profiles-daemon profile while quiet; empty leaves it alone.
PPD_PROFILE=power-saver
# Hosts (ssh names) that `quietmode on all` also switches.
PEERS="laptop"
