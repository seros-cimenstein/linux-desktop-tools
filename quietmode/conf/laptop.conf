# Lenovo V15 G3 ABA, Ryzen 7 5825U (8C/16T, boost 4.5 GHz), amd-pstate-epp.
# AMD exposes no writable package power limit, so the frequency cap is the
# only lever. Sourced as bash by /usr/local/bin/quietmode; re-run install.sh after editing.

# Ceiling for every core, in MHz. At 1400 the EC started the fan (EC reg 0x06
# went 0 -> 19) once its sensor 0xb0 reached 46 under sustained all-core load.
MAX_FREQ_MHZ=1100
# 1 = disable boost while quiet (no boost knob on kernel 6.8; the cap is below
# nominal frequency anyway).
NO_TURBO=1
RAPL_LONG_W=
RAPL_SHORT_W=
# power-profiles-daemon profile while quiet; empty leaves it alone.
PPD_PROFILE=power-saver
# Hosts (ssh names) that `quietmode on all` also switches.
PEERS=""
